# Docker Compose for rooms service
# Run independently with: cd ai_services/room_generator && docker compose up
# Or include in root orchestrator via `include:` directive
#
# This compose defines two services from the same Dockerfile:
# - api: FastAPI server on port 8103
# - worker: Background job processor (runs once and exits)
#
# Job/candidate/review state persists to Postgres (ai_services/docker-compose
# .common.yml's `postgres` service), in this service's own database
# (`curalina_rooms`) — never shared with recommendation's or variants'
# databases. Postgres schema is owned by the checked-in Alembic migrations
# under `migrations/versions/`, run at startup by both `api` and `worker`
# (see curalina_rooms.api.app / curalina_rooms.workers.runner). The
# `rooms_data` volume remains: it holds rendered image bytes
# (FilesystemAssetStore), which is unrelated to job/state persistence and is
# not part of this migration.

services:
  rooms_api:
    build:
      context: ../
      dockerfile: room_generator/Dockerfile
    container_name: curalina_rooms_api
    command: ["api"]
    ports:
      - "8103:8103"
    environment:
      CURALINA_DATABASE_URL: postgresql://curalina:curalina_dev_password@postgres:5432/curalina_rooms
      SERVICE_PORT: "8103"
      CURALINA_DATA_DIR: /data
      # Concept-render worker settings. Renderers are reached over HTTP by
      # service name on the shared compose network; no depends_on, so rooms
      # never waits on the heavy renderer containers.
      CURALINA_RENDER_BACKEND: ${CURALINA_RENDER_BACKEND:-http}
      CURALINA_ROOM_RENDERER: ${CURALINA_ROOM_RENDERER:-sd15}
      CURALINA_RENDERER_SD15_URL: ${CURALINA_RENDERER_SD15_URL:-http://sd15_renderer:8104}
      CURALINA_RENDERER_COMPOSITE_URL: ${CURALINA_RENDERER_COMPOSITE_URL:-http://composite_renderer:8105}
      CURALINA_RENDER_TIMEOUT_SECONDS: ${CURALINA_RENDER_TIMEOUT_SECONDS:-1500}
      # Lease must outlast the render timeout (validated at startup).
      CURALINA_JOB_TIMEOUT_SECONDS: ${CURALINA_JOB_TIMEOUT_SECONDS:-1800}
      CURALINA_RENDER_WIDTH: ${CURALINA_RENDER_WIDTH:-512}
      CURALINA_RENDER_HEIGHT: ${CURALINA_RENDER_HEIGHT:-512}
    volumes:
      # Named volume for rendered asset bytes only (/data/assets); job state
      # lives in Postgres now, not here.
      - rooms_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - curalina

  rooms_worker:
    build:
      context: ../
      dockerfile: room_generator/Dockerfile
    container_name: curalina_rooms_worker
    command: ["worker"]
    environment:
      CURALINA_DATABASE_URL: postgresql://curalina:curalina_dev_password@postgres:5432/curalina_rooms
      CURALINA_DATA_DIR: /data
      # Concept-render worker settings. Renderers are reached over HTTP by
      # service name on the shared compose network; no depends_on, so rooms
      # never waits on the heavy renderer containers.
      CURALINA_RENDER_BACKEND: ${CURALINA_RENDER_BACKEND:-http}
      CURALINA_ROOM_RENDERER: ${CURALINA_ROOM_RENDERER:-sd15}
      CURALINA_RENDERER_SD15_URL: ${CURALINA_RENDERER_SD15_URL:-http://sd15_renderer:8104}
      CURALINA_RENDERER_COMPOSITE_URL: ${CURALINA_RENDERER_COMPOSITE_URL:-http://composite_renderer:8105}
      CURALINA_RENDER_TIMEOUT_SECONDS: ${CURALINA_RENDER_TIMEOUT_SECONDS:-1500}
      # Lease must outlast the render timeout (validated at startup).
      CURALINA_JOB_TIMEOUT_SECONDS: ${CURALINA_JOB_TIMEOUT_SECONDS:-1800}
      CURALINA_RENDER_WIDTH: ${CURALINA_RENDER_WIDTH:-512}
      CURALINA_RENDER_HEIGHT: ${CURALINA_RENDER_HEIGHT:-512}
    volumes:
      # Same volume as API for shared rendered-asset access
      - rooms_data:/data
    # `unless-stopped`, not `no`: the worker's own Postgres connection has no
    # retry/backoff around a transient connection drop (e.g. a brief network
    # blip during a sibling container rebuild) -- a single failed lease
    # attempt is fatal to the process. Without this, that one transient
    # error permanently stops job processing until someone notices queued
    # jobs piling up and manually restarts the container. See STATUS.md.
    restart: unless-stopped
    networks:
      - curalina
    depends_on:
      postgres:
        condition: service_healthy
      rooms_api:
        condition: service_started  # Ensure api starts first (worker will read from shared database)

volumes:
  rooms_data:
    driver: local

networks:
  curalina:
    driver: bridge

# Brings in the shared `postgres` service so `depends_on: postgres` above
# resolves when this file is run standalone (not only via the root
# orchestrator's `include:`, which already pulls in docker-compose.common.yml
# once for the whole stack).
include:
  - ../docker-compose.common.yml
