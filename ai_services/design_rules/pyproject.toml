[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curalina-design-rules"
version = "0.0.0"
description = "Pure Python deterministic design-rules engine for Curalina."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Curalina" }]
dependencies = [
    "PyYAML>=6.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-shapely>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"curalina_design_rules.rules" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=curalina_design_rules --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are narrative/exploratory per agentic_flow/16_notebook_standard.md;
# relax line-length and import-position, but keep everything else (unused
# imports, undefined names, etc.) enforced same as package code.
"*.ipynb" = ["E501", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
