# Docker Compose for variants service
# Run independently with: cd ai_services/variant_generator && docker compose up
# Or include in root orchestrator via `include:` directive
#
# This compose defines two services from the same Dockerfile:
# - api: FastAPI server on port 8102
# - worker: Background job processor (runs once and exits)
#
# Persistence is Postgres (ai_services/docker-compose.common.yml's `postgres`
# service), in this service's own database (`curalina_variants`) — never
# shared with recommendation's or rooms' databases. Postgres schema is owned
# by the checked-in Alembic migrations under `migrations/versions/`, run at
# startup by both `api` and `worker` (see curalina_variants.api.app /
# curalina_variants.workers.runner).

services:
  variants_api:
    build:
      context: ../
      dockerfile: variant_generator/Dockerfile
    container_name: curalina_variants_api
    command: ["api"]
    ports:
      - "8102:8102"
    environment:
      CURALINA_DATABASE_URL: postgresql://curalina:curalina_dev_password@postgres:5432/curalina_variants
      SERVICE_PORT: "8102"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - curalina

  variants_worker:
    build:
      context: ../
      dockerfile: variant_generator/Dockerfile
    container_name: curalina_variants_worker
    command: ["worker"]
    environment:
      CURALINA_DATABASE_URL: postgresql://curalina:curalina_dev_password@postgres:5432/curalina_variants
    # `unless-stopped`, not `no` -- see the identical comment on rooms_worker
    # in ai_services/room_generator/docker-compose.yml. Same failure mode,
    # found the same way: both workers died together on a transient Postgres
    # connection drop and neither came back.
    restart: unless-stopped
    networks:
      - curalina
    depends_on:
      postgres:
        condition: service_healthy
      variants_api:
        condition: service_started  # Ensure api starts first (worker will read from shared database)

networks:
  curalina:
    driver: bridge

# Brings in the shared `postgres` service so `depends_on: postgres` above
# resolves when this file is run standalone (not only via the root
# orchestrator's `include:`, which already pulls in docker-compose.common.yml
# once for the whole stack).
include:
  - ../docker-compose.common.yml
