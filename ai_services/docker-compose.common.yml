# Shared infrastructure services for Curalina AI services
#
# STATUS: All three AI services (recommendation, variants, rooms) persist to
# Postgres, each in its OWN database inside this one Postgres instance
# (curalina_recommendation, curalina_variants, curalina_rooms — never a
# shared database, so the services stay logically and operationally
# independent the same way they were as separate SQLite files). This
# replaces the old per-service SQLite-in-a-named-volume setup: Cloud Run's
# filesystem is ephemeral per-instance and wiped on redeploy/scale, so SQLite
# would silently lose data there. Each service's own docker-compose.yml
# depends on `postgres` with a healthcheck-gated condition and runs its own
# checked-in Alembic migrations at container startup.

services:
  postgres:
    image: postgres:16-alpine
    container_name: curalina_postgres
    environment:
      # Default user and database; change these in production
      POSTGRES_USER: curalina
      POSTGRES_PASSWORD: curalina_dev_password
      POSTGRES_DB: curalina
    ports:
      - "5432:5432"
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curalina -d curalina"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - curalina

volumes:
  postgres_data:
    driver: local

networks:
  curalina:
    driver: bridge
