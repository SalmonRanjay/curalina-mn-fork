# Docker Compose for recommendation service
# Run independently with: cd ai_services/recommendation && docker compose up
# Or include in root orchestrator via `include:` directive
#
# Persistence is Postgres (ai_services/docker-compose.common.yml's `postgres`
# service), in this service's own database (`curalina_recommendation`) —
# never shared with variants' or rooms' databases. Postgres schema is owned
# by the checked-in Alembic migrations under `migrations/versions/`, run at
# container startup (see curalina_recommendation.bootstrap).

services:
  recommendation_api:
    build:
      context: ../
      dockerfile: recommendation/Dockerfile
    container_name: curalina_recommendation_api
    ports:
      - "8101:8101"
    environment:
      CURALINA_DATABASE_URL: postgresql://curalina:curalina_dev_password@postgres:5432/curalina_recommendation
      SERVICE_PORT: "8101"
      # Consultation recommender (ADR-0025): the supplier handoff workbooks are
      # read in place, never baked into the image (STATUS item 35).
      CURALINA_SUPPLIER_DATA_DIR: /data/supplier_csv
      CURALINA_CATALOGUE_CURRENCY: CAD
    volumes:
      - type: bind
        source: ${SUPPLIER_CSV_HOST_DIR:-/Users/rjsalmon/Documents/Humber/misc.curalina/Supplier CSV Files}
        target: /data/supplier_csv
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - curalina

networks:
  curalina:
    driver: bridge

# Brings in the shared `postgres` service so `depends_on: postgres` above
# resolves when this file is run standalone (not only via the root
# orchestrator's `include:`, which already pulls in docker-compose.common.yml
# once for the whole stack).
include:
  - ../docker-compose.common.yml
